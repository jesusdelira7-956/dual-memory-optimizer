name: Build & Publish Chrome Extension Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow for asset verification
        run: pip install Pillow

      - name: Read Manifest Version
        id: meta
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('extension/manifest.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run Validation, Permission Audit & Package Extension
        run: |
          python3 test_extension.py
          python3 audit_permissions.py
          python3 package_cws.py

      - name: Create or Update Latest GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: "Dual-Memory Optimizer v${{ steps.meta.outputs.version }} (Drag-and-Drop Chrome ZIP)"
          body: |
            ### ⚡ Dual-Memory Optimizer v${{ steps.meta.outputs.version }}
            **Sovereign Manifest V3 Chrome Extension** for slashing generative AI prompt context and token consumption by 70–85%.

            #### ⚡ Fastest Install (Drag & Drop — No Unzipping Needed!)
            1. Download **`Dual-Memory-Optimizer-v${{ steps.meta.outputs.version }}.zip`** below.
            2. Open `chrome://extensions/` in Chrome (or Brave/Edge) and turn on **Developer mode** (top right).
            3. **Drag and drop `Dual-Memory-Optimizer-v${{ steps.meta.outputs.version }}.zip`** directly onto the `chrome://extensions/` page!
          files: dist/Dual-Memory-Optimizer-v${{ steps.meta.outputs.version }}.zip
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
