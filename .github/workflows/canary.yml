name: Extension Canary & Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install Pillow

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Python MV3, Permission Audit & Unit Tests
        run: |
          python3 test_extension.py
          python3 audit_permissions.py
          node --test tests/token_condenser.test.mjs
          python3 package_cws.py

      - name: Install Playwright & Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Run Headless Chromium Extension E2E Canary
        run: node tests/e2e_canary.mjs

      - name: Report Scheduled Selector Drift Issue
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Canary Alert: Selector or MV3 Drift Detected';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'selector-drift',
            });
            const existing = issues.find((i) => i.title === title);
            const body = `Weekly canary workflow failed on run ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}. Inspect Playwright E2E logs for selector or Chromium changes.`;
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['selector-drift'],
              });
            }
